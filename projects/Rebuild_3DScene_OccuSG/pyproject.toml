[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-sg"
version = "0.1.0"
description = "ROS-free Phase 1 contracts and geometry primitives for OccuSG"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
visualization = ["matplotlib>=3.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

